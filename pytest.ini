[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
filterwarnings =
    ignore:.*was never imported.*:coverage.exceptions.CoverageWarning
    ignore:.*was previously imported.*:coverage.exceptions.CoverageWarning
addopts =
    --cov=core
    --cov=trackers
    --cov=inference
    --cov=geometry_utils
    --cov=analytics
    --cov=src/data
    --cov=detectors
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
    -q
